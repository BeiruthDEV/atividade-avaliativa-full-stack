version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: mongo_fullstack
    ports:
      - "27019:27017"
    networks:
      - minha_rede_personalizada
    volumes:
      - mongo_data:/data/db

  mysql:
    image: mysql:8
    container_name: mysql_fullstack
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: loja_de_carros
    ports:
      - "3307:3306"
    networks:
      - minha_rede_personalizada
    volumes:
      - mysql_data:/var/lib/mysql


networks:
  minha_rede_personalizada:
    driver: bridge

volumes:
  mongo_data:
  mysql_data:
